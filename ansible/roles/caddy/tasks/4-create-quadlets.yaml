---
- name: Validate required variables are defined
  ansible.builtin.assert:
    that:
      - caddy_dns_provider is in _caddy_supported_dns_provider
    fail_msg: "Required variable is not defined correctly for {{ inventory_hostname }}"
    quiet: true
  tags:
    - validate

- name: Validate required variables are defined
  ansible.builtin.assert:
    that:
      - caddy_cloudflare_acme_api_token is defined
    fail_msg: "Required variable is not defined correctly for {{ inventory_hostname }}"
    quiet: true
  when: caddy_dns_provider == "cloudflare"
  tags:
    - validate

- name: Create caddy quadlets
  become: true
  become_user: "{{ caddy_user_name }}"
  block:
    - name: Create systemd user folder
      ansible.builtin.file:
        path: "{{ caddy_user_home }}/.config/systemd/user"
        state: directory
        mode: u=rwx,g=rx,o=

    - name: Add socket unit (socket activation)
      ansible.builtin.copy:
        src: caddy.socket
        dest: "{{ caddy_user_home }}/.config/systemd/user/caddy.socket"
        mode: u=rw,g=r,o=

    - name: Create container systemd folder
      ansible.builtin.file:
        path: "{{ caddy_user_home }}/.config/containers/systemd"
        state: directory
        mode: u=rwx,g=rx,o=

    - name: Create caddy image build directory
      ansible.builtin.file:
        path: "{{ caddy_dir_build }}"
        state: directory
        mode: u=rwx,g=rx,o=

    - name: Create caddy Containerfile
      ansible.builtin.template:
        src: Containerfile.j2
        dest: "{{ caddy_dir_build }}/Containerfile"
        mode: u=rw,g=r,o=
      notify:
        - Build caddy image
        - Schedule caddy restart

    - name: Create caddy image build unit
      ansible.builtin.template:
        src: caddy.build.j2
        dest: "{{ caddy_build }}"
        mode: u=rw,g=r,o=
      notify:
        - Build caddy image
        - Schedule caddy restart

    - name: Check caddy image exists
      ansible.builtin.command:
        cmd: "podman image exists {{ caddy_image_name }}"
      register: caddy_image_exists
      changed_when: caddy_image_exists.rc == 1
      failed_when: caddy_image_exists.rc not in [0, 1]
      check_mode: false
      notify:
        - Build caddy image
        - Schedule caddy restart

    - name: Add image rebuild service
      ansible.builtin.copy:
        src: caddy-image-rebuild.service
        dest: "{{ caddy_user_home }}/.config/systemd/user/caddy-image-rebuild.service"
        mode: u=rw,g=r,o=

    - name: Add image rebuild timer
      ansible.builtin.template:
        src: caddy-image-rebuild.timer.j2
        dest: "{{ caddy_user_home }}/.config/systemd/user/{{ caddy_image_rebuild_timer_unit }}"
        mode: u=rw,g=r,o=
      notify:
        - Restart caddy image rebuild timer

    - name: Enable image rebuild and podman auto-update timers
      ansible.builtin.systemd_service:
        service: "{{ item }}"
        enabled: true
        state: started
        scope: user
        daemon_reload: true
      loop:
        - "{{ caddy_image_rebuild_timer_unit }}"
        - podman-auto-update.timer
      when: not ansible_check_mode

    - name: Create (runtime) data volume
      ansible.builtin.copy:
        src: caddy-data.volume
        dest: "{{ caddy_user_home }}/.config/containers/systemd/caddy-data.volume"
        mode: u=rw,g=r,o=

    - name: Create (runtime) config volume
      ansible.builtin.copy:
        src: caddy-config.volume
        dest: "{{ caddy_user_home }}/.config/containers/systemd/caddy-config.volume"
        mode: u=rw,g=r,o=

    - name: Create caddy container dropin folder
      ansible.builtin.file:
        path: "{{ caddy_container_d }}"
        state: directory
        mode: u=rwx,g=rx,o=

    - name: Caddy has credential (non-localhost dns provider)
      when: caddy_dns_provider != "localhost"
      ansible.builtin.set_fact:
        _caddy_has_credentials: true

    - name: Check credential dropin exists
      ansible.builtin.stat:
        path: "{{ caddy_container_d_credential }}"
      register: caddy_credential_file
      diff: true

    - name: Create credential
      when: >-
        not caddy_credential_file.stat.exists
        or all_refresh_credential | default(false) | bool
        or caddy_refresh_credential | default(false) | bool
      block:
        - name: Create cloudflare credential
          when: caddy_dns_provider == "cloudflare"
          block:
            - name: Create encrypted systemd credential
              ansible.builtin.command:
                cmd: "systemd-creds encrypt --user --pretty --name={{ _caddy_cloudflare_acme_api_token_name }} - -"
                stdin: "{{ caddy_cloudflare_acme_api_token }}"
              register: caddy_credential_acme_api_token
              changed_when: false
              no_log: true

            - name: Add systemd service credential dropin
              ansible.builtin.copy:
                dest: "{{ caddy_container_d_credential }}"
                content: |
                  [Service]
                  {{ caddy_credential_acme_api_token.stdout }}
                mode: u=rw,g=r,o=
              notify:
                - Schedule caddy restart

    - name: Add container unit
      ansible.builtin.template:
        src: caddy.container.j2
        dest: "{{ caddy_container }}"
        mode: u=rw,g=r,o=
      notify:
        - Schedule caddy restart
