---
- name: Validate required variables are defined
  ansible.builtin.assert:
    that:
      - opencloud_user_name  is defined
      - opencloud_user_home  is defined
      - opencloud_subdomain  is defined
      - opencloud_port       is defined
      - opencloud_version    is defined
      - opencloud_dir_data   is defined
      - opencloud_dir_config is defined
      - opencloud_root_ca    is defined
      - host_maindomain      is defined
      - authelia_subdomain   is defined
    fail_msg: "Required variable is not defined correctly for {{ inventory_hostname }}"
    quiet: true
  tags:
    - validate
