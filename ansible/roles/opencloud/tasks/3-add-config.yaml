---
- name: Validate required variables are defined
  ansible.builtin.assert:
    that:
      - host_maindomain      is defined
    fail_msg: "Required variable is not defined correctly for {{ inventory_hostname }}"
    quiet: true
  tags:
    - validate

- name: Add opencloud config
  become: true
  become_user: "{{ opencloud_user_name }}"
  block:
    - name: Add config folder for opencloud
      ansible.builtin.file:
        path: "{{ opencloud_dir_config_opencloud }}"
        state: directory
        mode: u=rwx,g=rx,o=

    - name: Add config folder for collabora
      ansible.builtin.file:
        path: "{{ opencloud_dir_config_collabora }}"
        state: directory
        mode: u=rwx,g=rx,o=

    - name: Add csp configuration
      ansible.builtin.template:
        src: "csp.yaml.j2"
        dest: "{{ opencloud_dir_config_opencloud }}/csp.yaml"
        mode: u=rw,g=r,o=
