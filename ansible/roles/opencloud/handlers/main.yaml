---
- name: Restart opencloud
  become: true
  become_user: "{{ opencloud_opencloud_user_name }}"
  ansible.builtin.systemd_service:
    service: "opencloud-pod.service"
    state: restarted
    scope: user
    daemon_reload: true
  when: not ansible_check_mode

- name: Restart collabora
  become: true
  become_user: "{{ opencloud_collabora_user_name }}"
  ansible.builtin.systemd_service:
    service: "collabora-pod.service"
    state: restarted
    scope: user
    daemon_reload: true
  when: not ansible_check_mode
