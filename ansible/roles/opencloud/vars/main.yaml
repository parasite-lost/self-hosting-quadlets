---
# baked-in uid/gid of collabora container user
opencloud_collabora_uid: '1001'
opencloud_collabora_gid: '1001'

# configuration directories
opencloud_dir_config_opencloud: "{{ opencloud_opencloud_user_home }}/config/opencloud"
# can be overridden with --extra-vars '{"opencloud_refresh_credential": true}'
opencloud_refresh_credential: false
