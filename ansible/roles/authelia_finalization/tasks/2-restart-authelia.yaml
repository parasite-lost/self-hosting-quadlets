---
- name: Ensure authelia is restarted (if needed)
  become: true
  become_user: "{{ authelia_user_name }}"
  block:
    - name: Restart authelia (if needed)
      when: _authelia_restart_needed
      ansible.builtin.debug:
        msg: Scheduling authelia restart
      changed_when: true
      notify:
        - Restart authelia
