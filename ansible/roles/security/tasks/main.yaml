---
- name: Validate required variables are defined
  ansible.builtin.assert:
    that:
      - security_fail2ban_ignoreip is defined
      - security_fail2ban_ignoreip is not mapping
      - security_fail2ban_ignoreip | length > 0
    fail_msg: "Required variable is not defined correctly for {{ inventory_hostname }}"
    quiet: true
  tags:
    - validate

- name: Check if key-based SSH login is available, then disable password-based SSH login
  block:
    - name: Check key-based SSH login is available
      ansible.builtin.command:
        cmd: >
          ssh -o BatchMode=yes
              -o ConnectTimeout=5
              -o PreferredAuthentications=publickey
              -o PubkeyAuthentication=yes
              -o PasswordAuthentication=no
              {{ hostvars[inventory_hostname]['ansible_user'] }}@{{ hostvars[inventory_hostname]['ansible_host'] | default(inventory_hostname) }} "echo OK"
      delegate_to: localhost
      register: security_ssh_key_check
      failed_when: false
      changed_when: false

    - name: Abort if key-based SSH login failed
      ansible.builtin.fail:
        msg: >
          CRITICAL: Key-based SSH login failed for
          {{ hostvars[inventory_hostname]['ansible_user'] }}@{{ hostvars[inventory_hostname]['ansible_host'] | default(inventory_hostname) }}.
          Password authentication was NOT disabled to prevent locking you out.
      when: security_ssh_key_check.rc != 0

    - name: Harden sshd
      when: security_ssh_key_check.rc == 0
      become: true
      ansible.builtin.template:
        src: "40-hardening.conf.j2"
        dest: "/etc/ssh/sshd_config.d/40-hardening.conf"
        mode: u=r,g=,o=
        validate: /usr/sbin/sshd -t -f %s
      notify:
        - Reload sshd

- name: Harden system security
  become: true
  block:
    - name: Install fail2ban (without sendmail)
      ansible.builtin.dnf:
        name:
          - fail2ban-firewalld
          - fail2ban-systemd
        state: present

    - name: Configure fail2ban
      ansible.builtin.template:
        src: "fail2ban.local.j2"
        dest: "/etc/fail2ban/fail2ban.local"
        mode: u=rw,g=r,o=r
      notify:
        - Reload fail2ban

    - name: Add fail2ban action to ban on all ports
      ansible.builtin.copy:
        src: "firewallcmd-rich-allports.conf"
        dest: "/etc/fail2ban/action.d/firewallcmd-rich-allports.conf"
        mode: u=rw,g=r,o=r
      notify:
        - Reload fail2ban

    - name: Configure fail2ban jail defaults
      ansible.builtin.template:
        src: "jail.local.j2"
        dest: "/etc/fail2ban/jail.local"
        mode: u=rw,g=r,o=r
      notify:
        - Reload fail2ban

    - name: Configure fail2ban sshd jail
      ansible.builtin.template:
        src: "sshd.local.j2"
        dest: "/etc/fail2ban/jail.d/sshd.local"
        mode: u=rw,g=r,o=r
      notify:
        - Reload fail2ban

    - name: Enable fail2ban
      ansible.builtin.systemd_service:
        service: fail2ban
        state: started
        enabled: true
      when: not ansible_check_mode

    - name: Block cockpit
      ansible.posix.firewalld:
        # firewall-cmd --remove-service=cockpit --permanent
        service: cockpit
        permanent: true
        state: disabled
        # reload firewall
        immediate: true
