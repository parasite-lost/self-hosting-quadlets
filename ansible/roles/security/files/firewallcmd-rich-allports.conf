# like firewallcmd-rich-rules.conf, but bans the source address on all ports
[INCLUDES]
before = firewallcmd-common.conf

[Definition]
actionstart =
actionstop =
actioncheck =
fwcmd_rich_rule = rule family='<family>' source address='<ip>' <rich-blocktype>
actionban = firewall-cmd --add-rich-rule="%(fwcmd_rich_rule)s"
actionunban = firewall-cmd --remove-rich-rule="%(fwcmd_rich_rule)s"
