# fail2ban filter for Authelia (text log format)
# since password reset is disabled only authentication attempts are matched
# see: https://www.authelia.com/overview/security/measures/
[Definition]
failregex = ^.*Unsuccessful (1FA|TOTP|Duo|U2F) authentication attempt by user .*remote_ip"?(:|=)"?<HOST>"?.*$
ignoreregex = ^.*level"?(:|=)"?info.*
              ^.*level"?(:|=)"?warning.*
