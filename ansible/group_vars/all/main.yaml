---
# avoid '[WARNING]: Module invocation had junk after the JSON data:'
ansible_ssh_common_args: '-o "SetEnv TERM=dumb"'
# local data
local_user: "{{ lookup('env', 'USER') }}"
local_home: "{{ lookup('env', 'HOME') }}"

# can be overridden with --extra-vars=all_refresh_credential=true
all_refresh_credential: false

# do not write logs on target
ansible_no_target_syslog: true
